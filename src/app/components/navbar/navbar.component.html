<header class="nav" [class.scrolled]="scrolled() || menuOpen()">
  <div class="container nav-inner">
    <a class="brand" href="#top" (click)="closeMenu()">
      Nishant <span>Kohale</span>
    </a>

    <nav class="nav-links" aria-label="Primary">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href">{{ link.label }}</a>
      }
      <a class="btn btn-primary nav-cta" [href]="profile.resumeFile" download>Resume</a>
    </nav>

    <button
      class="menu-toggle"
      [class.open]="menuOpen()"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<div class="mobile-panel" [class.open]="menuOpen()">
  <nav aria-label="Mobile">
    @for (link of navLinks; track link.href) {
      <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
    }
    <a class="btn btn-primary" [href]="profile.resumeFile" download (click)="closeMenu()">
      Download Resume
    </a>
  </nav>
</div>
